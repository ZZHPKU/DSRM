[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "DSRM"
version = "0.2.0"
description = "Neural PINN, global stochastic residual, and backward regression PDE solvers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy>=1.24", "scipy>=1.10"]

[project.scripts]
DSRM = "DSRM.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

